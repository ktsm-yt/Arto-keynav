name: Publish macOS beta

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    uses: ./.github/workflows/bundle.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arto-keynav-macos-arm64
          path: dist
      - name: Create prerelease and upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GH_REPO" --verify-tag --prerelease --generate-notes --title "$TAG"
          (cd dist && shasum -a 256 -- *.dmg > SHA256SUMS)
          gh release upload "$TAG" --repo "$GH_REPO" dist/*.dmg dist/SHA256SUMS --clobber
