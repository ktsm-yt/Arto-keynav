name: Bundle macOS beta

on:
  workflow_call:
    inputs:
      version:
        description: Release tag (empty keeps 0.0.0)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (empty keeps 0.0.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: ./.github/actions/setup-toolchain
        with:
          toolchain: native
      - name: Install Dioxus CLI
        run: |
          asset=dx-aarch64-apple-darwin.tar.gz
          gh release download v0.7.3 --repo DioxusLabs/dioxus --pattern "$asset" --pattern dx-aarch64-apple-darwin.sha256 --dir "$RUNNER_TEMP/dx"
          cd "$RUNNER_TEMP/dx"
          grep '  dx-aarch64-apple-darwin.tar.gz$' dx-aarch64-apple-darwin.sha256 | shasum -a 256 -c -
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/dx" >> "$GITHUB_PATH"
          dx --version | grep -F 0.7.3
      - name: Validate release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
      - name: Stamp release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          perl -i -pe 's/= "0\.0\.0"/= "'"${VERSION}"'"/g' Cargo.toml
          echo "$VERSION" > crates/arto/VERSION
      - run: just fmt check test
      - run: just build
      - run: just verify-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: arto-keynav-macos-arm64
          path: target/dx/arto/bundle/**/Arto_Keynav_*.dmg
          if-no-files-found: error
          retention-days: 14
